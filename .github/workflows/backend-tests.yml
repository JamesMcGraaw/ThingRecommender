name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - "ThingRecommender.slnx"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "ThingRecommender.slnx"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ThingRecommender.slnx

      - name: Build
        run: dotnet build ThingRecommender.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ThingRecommender.slnx --no-build --configuration Release --logger "console;verbosity=normal"
